name: lanpair
description: Bounded, evidence-based diagnostics between two explicitly paired LAN devices.
publish_to: none
version: 0.1.1+2

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^2.0.0
  basic_utils: ^5.8.2
  crypto: ^3.0.6
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  camera: ^0.12.2
  zxing_lib: ^1.1.4
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
